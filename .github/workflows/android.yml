name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O runner do GitHub já traz o Android SDK; só aceitamos as licenças.
      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npm run android:assets
          node scripts/patch-android.js
          npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TrucoPro-debug.apk

      # Versão assinada (opcional): ativa quando os secrets da chave existem.
      - name: Compilar e assinar versão release (APK + AAB)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out ../TrucoPro.apk aligned.apk
          jarsigner -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar ../TrucoPro.aab app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: TrucoPro-${{ env.VERSION_NAME }}
          path: |
            TrucoPro*.apk
            TrucoPro*.aab
          if-no-files-found: error

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Truco Pro ${{ env.VERSION_NAME }}
          body: |
            Baixe o **TrucoPro.apk** (assinado) ou o **TrucoPro-debug.apk** no celular e instale.
            O arquivo **.aab** é o pacote para envio à Google Play.
          files: |
            TrucoPro*.apk
            TrucoPro*.aab
